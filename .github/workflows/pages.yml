name: Deploy Middle Earth War Tracker
on:
  push:
    paths:
      - "middle-earth/**"
      - ".github/workflows/pages.yml"
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: middle-earth
      - id: deployment
        uses: actions/deploy-pages@v4