<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elenor War Tracker</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<main class="wrap">
<header class="hero">
  <div><div class="eyebrow">ELENOR / WAR TRACKER</div><h1>Monitoramento de guerra</h1><p>XP, online e atividade em tempo real via WOTServer.</p></div>
  <div class="hero-right"><div class="clock" id="clock">--:--:--</div><a class="admin-link" href="admin.html">⚙ Admin</a></div>
</header>
<section class="cards">
  <div class="card up"><strong id="up">0</strong><span>🟢 UPANDO</span></div>
  <div class="card stop"><strong id="stop">0</strong><span>🟡 ONLINE / PARADO</span></div>
  <div class="card off"><strong id="off">0</strong><span>⚫ OFFLINE</span></div>
</section>
<div class="notice"><span>Regra: XP ganho nos últimos <b>3 minutos</b> = UPANDO.</span><span id="sync">Sincronizando...</span></div>
<div id="groups"></div><div id="deaths"></div>
<footer>Última atualização: <span id="updated">--</span></footer>
</main>
<script src="viewer.js"></script>
</body></html>
